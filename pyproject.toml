[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "condor_pipeline"
version = "0.1.0"
description = "Circadia Lab actigraphy sleep analysis library"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["condor_pipeline*"]
